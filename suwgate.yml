settings:
  docs-paths:
    ignore: [Suwageval.Web/node_modules/, setup.sh, secrets.json, .secrets/, .artifacts/nupkg, scripts/.internal/package.sh, suwageval/, monitoring-checks.yaml, refund-damaged-item.yaml]
  hooks:
    protected: [Suwageval.Gate/**]
    generated:
      - path: "**/openapi.d.ts"
        command: just api-types
      - path: "**/contract/openapi.json"
        command: just api-types
dev:
  name: suwageval
  ports:
    server: 6230
    web: 3230
    e2eServer: 6231
    e2eWeb: 3231
    database: 5463
    stack: 8093
  server:
    project: Suwageval.Server
