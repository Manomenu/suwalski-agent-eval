profiles: [web, dotnet, database]
directories:
  web: Suwageval.Web
steps:
  add:
    - name: chart
      title: the Helm chart lints and renders, label and annotation names within 63 characters (Suwageval.Gate/scripts/chart.sh)
      run: Suwageval.Gate/scripts/chart.sh
      limitSeconds: 120
    - name: plugin-session-hook
      title: the plugin's session hook gives an agent's repository the Suwageval loop (claude-plugin/scripts/session-context.sh on the CLI's sample agent)
      run: CLAUDE_PROJECT_DIR=Suwageval.Cli.Tests/Sample sh claude-plugin/scripts/session-context.sh | grep -q "tested and watched by Suwageval"
      limitSeconds: 30
exceptions:
  - guard: architecture/every-project-guarded
    target: Suwageval.AgentSdk
    reason: its layers end in the root namespace, which the layers guard cannot name; AgentSdkContractsTests guard them in Suwageval.Server.Tests, the tests the SDK's release workflow runs
  - guard: architecture/every-project-guarded
    target: Suwageval.Contracts
    reason: plain records that mirror the server's areas, with no layer above another to keep apart
  - guard: architecture/interfaces-have-two-implementations
    target: Suwageval.AgentSdk.Invocation.IAgentContractSource
    reason: the agent under test implements it, outside this repository
  - guard: architecture/interfaces-have-two-implementations
    target: Suwageval.AgentSdk.Invocation.ITurnHandler
    reason: the agent under test implements it, outside this repository
  - guard: appsettings-bound
    target: Invocation
    reason: bound by BindConfiguration(InvocationOptions.Section), a constant the guard does not read
  - guard: appsettings-bound
    target: Judge
    reason: bound by BindConfiguration(JudgeOptions.Section), a constant the guard does not read
  - guard: appsettings-bound
    target: Runs
    reason: bound by BindConfiguration(RunsOptions.Section), a constant the guard does not read
  - guard: appsettings-bound
    target: Simulation
    reason: bound by BindConfiguration(SimulationOptions.Section), a constant the guard does not read
  - guard: banned-npm-packages
    target: "@mantine/charts"
    reason: the web app is built on Mantine until its own change moves it to suwfrontkit (TODO.md)
  - guard: banned-npm-packages
    target: "@mantine/core"
    reason: the web app is built on Mantine until its own change moves it to suwfrontkit (TODO.md)
  - guard: banned-npm-packages
    target: "@mantine/hooks"
    reason: the web app is built on Mantine until its own change moves it to suwfrontkit (TODO.md)
  - guard: no-raw-colors
    target: Suwageval.Web/src/main.tsx
    reason: the Mantine theme, the one place the colours are defined, until the move to suwfrontkit (TODO.md)
  - guard: forbidden-names
    target: claude-plugin/hooks
    reason: the folder name Claude Code reads a plugin's hooks from
  - guard: forbidden-names
    target: deploy/chart/templates/_helpers.tpl
    reason: the name Helm's convention gives the chart's named templates (helm create)
  - guard: image-pins
    target: deploy/chart/templates/live-check.yaml
    reason: the image is a Helm template ({{ include "app.image" }}) whose tag is required at deployment, never latest
  - guard: image-pins
    target: deploy/chart/templates/server.yaml
    reason: the image is a Helm template ({{ include "app.image" }}) whose tag is required at deployment, never latest
  - guard: image-pins
    target: deploy/chart/templates/smoke-test.yaml
    reason: the image is a Helm template ({{ include "app.image" }}) whose tag is required at deployment, never latest
  - guard: image-pins
    target: deploy/chart/templates/web.yaml
    reason: the image is a Helm template ({{ include "app.image" }}) whose tag is required at deployment, never latest
  - guard: architecture/no-escape-hatches
    target: Suwageval.Cli.Tests/Evaluation/Run/RunCommandTests.cs
    reason: a test file; AGENTS.md bans the null-forgiving ! outside tests only, and a test that reads a value it has just asserted states it with !
