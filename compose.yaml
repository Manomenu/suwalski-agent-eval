# The local stand-in for the cluster. Same images, wired the way the ingress wires them: the
# browser only ever talks to web, and /api is proxied on to server.
#
#   just up   ->  http://localhost:8093
#
# This is a verification harness, not the deployment: the whole stack runs on a laptop
# without the cluster. The cluster gets the same images from the registry (deploy/chart).
# A service the app gains (a converter, a cache) is added here AND in the chart, together.

services:
  server:
    image: suwageval-server:local
    build:
      context: .
      dockerfile: Suwageval.Server/Dockerfile
    # The judge's model (Models__judge__BaseUrl, Models__judge__Model) and, optionally, the simulated user's
    # (Models__simulator__*) and the user describer's (Models__describer__*) from the gitignored .env, as for `just server`; without the judge's the stack runs and refuses runs with judge checks. .env.example lists the names.
    env_file:
      - path: .env
        required: false
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=suwageval;Username=suwageval;Password=suwageval
    healthcheck:
      # The runtime image has no curl or wget; bash's /dev/tcp asks /health without adding one.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/6230 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '"ok"' <&3
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # A volume of its own, apart from the one `just db up` uses, so the stack and the
  # development server never share data. No published port: only the server reaches it.
  postgres:
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: suwageval
      POSTGRES_PASSWORD: suwageval
      POSTGRES_DB: suwageval
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "suwageval", "-d", "suwageval"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: suwageval-web:local
    build:
      context: .
      dockerfile: Suwageval.Web/Dockerfile
    environment:
      API_UPSTREAM: http://server:6230
    ports:
      - "8093:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres:
