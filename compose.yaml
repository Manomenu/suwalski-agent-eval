name: suwageval

services:
  db:
    profiles: ["db"]
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: suwageval
      POSTGRES_PASSWORD: suwageval
      POSTGRES_DB: suwageval
    ports:
      - "127.0.0.1:5463:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "suwageval", "-d", "suwageval"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: suwageval-server:local
    build:
      context: .
      dockerfile: Suwageval.Server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=suwageval;Username=suwageval;Password=suwageval
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/6230 && printf 'GET /alive HTTP/1.0\r\n\r\n' >&3 && grep -q 'Healthy' <&3
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: suwageval
      POSTGRES_PASSWORD: suwageval
      POSTGRES_DB: suwageval
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "suwageval", "-d", "suwageval"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: suwageval-web:local
    build:
      context: .
      dockerfile: Suwageval.Web/Dockerfile
    environment:
      API_UPSTREAM: http://server:6230
    ports:
      - "127.0.0.1:8093:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
    name: suwageval-postgres
  postgres:
