# Defaults. The image tag is empty on purpose: the platform repo sets it, because it decides
# what runs. A tag hard-coded here would make a code commit a deployment at the same time.

# Off = the chart renders nothing: Argo prunes every object of the release and the cluster is free,
# while what the chart does not own stays (the namespace, its Secrets, the database). The platform
# repo switches a deployment off and on with this one value.
enabled: true

image:
  registry: ghcr.io/manomenu/suwalski-agent-eval
  tag: "" # e.g. sha-a1b2c3d — set by the Argo Application
  pullPolicy: IfNotPresent
  # A docker-registry Secret in the release namespace, for a private registry. The platform
  # repo creates it (scripts/projects/…/setup.sh); empty = pull without logging in.
  pullSecret: ""

server:
  replicas: 1
  port: 6230
  # A Secret with ConnectionStrings__Default (an Npgsql connection string) in the release namespace, created by the platform repo. Without
  # a database the server deliberately does not start.
  databaseSecret: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# The model Suwageval itself calls to give the verdicts of `judge` checks: an OpenAI-compatible
# server (its endpoints directly under baseUrl, e.g. {baseUrl}/chat/completions). Empty baseUrl and
# secret = no model: the server starts, and a run with judge checks is refused. maxConcurrency is the
# one pool of calls to this model, shared by everything that asks (TODO.md, "Parallel runs").
# The address of a private model server does not belong in a public repo, so on the cluster use
# `secret`: a Secret in the release namespace with Models__judge__BaseUrl and Models__judge__Model,
# created by the platform repo's setup.sh; the server and the live check read it through envFrom and
# baseUrl/name are then ignored. baseUrl/name are the plain-values way, for a model that may be public.
judgeModel:
  baseUrl: ""
  name: ""
  secret: ""
  maxConcurrency: 8

# The simulated user of simulated scenarios is played by the same model (Simulation:Model is `judge` in
# appsettings.json), so it shares that pool. temperature: how freely the simulated user writes, 0 to 2;
# empty = the server's default (0.7).
simulation:
  temperature: ""

# The daily check of that model from the cluster's own network (templates/live-check.yaml): the
# server's image, another command, one judge call with a fixed tiny case. Rendered only with a
# judgeModel. A failure turns the Job red and, with discordSecret, posts to the alerts channel.
liveCheck:
  schedule: "17 6 * * *" # once a day (the CronJob's time zone is Europe/Warsaw)
  # A Secret in the release namespace with LiveCheck__DiscordWebhookUrl (a Discord webhook), created
  # by the platform repo's setup.sh. Optional: empty or missing = the check only fails the Job.
  discordSecret: ""
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 256Mi }

web:
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Checked after every deploy (templates/smoke-test.yaml): a Job Argo runs after each sync.
smokeTest:
  enabled: true
  image: docker.io/curlimages/curl:8.22.0

ingress:
  enabled: true
  className: traefik
  host: suwageval.k8s.example.internal
