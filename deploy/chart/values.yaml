enabled: true

image:
  registry: ghcr.io/manomenu/suwalski-agent-eval
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ""

server:
  replicas: 1
  port: 6230
  databaseSecret: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

models:
  fallback:
    baseUrl: ""
    name: ""
    secret: ""
    maxConcurrency: 8
  judge:
    baseUrl: ""
    name: ""
    secret: ""
    maxConcurrency: 8
  simulator:
    baseUrl: ""
    name: ""
    secret: ""
    maxConcurrency: 8
  describer:
    baseUrl: ""
    name: ""
    secret: ""
    maxConcurrency: 8

simulation:
  temperature: ""

liveCheck:
  schedule: "17 6 * * *"
  discordSecret: ""
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 256Mi }

web:
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

smokeTest:
  enabled: true
  image: docker.io/curlimages/curl:8.23.0

ingress:
  enabled: true
  className: traefik
  host: suwageval.k8s.example.internal
