# Defaults. The image tag is empty on purpose: the platform repo sets it, because it decides
# what runs. A tag hard-coded here would make a code commit a deployment at the same time.

image:
  registry: ghcr.io/manomenu/suwalski-agent-eval
  tag: "" # e.g. sha-a1b2c3d — set by the Argo Application
  pullPolicy: IfNotPresent
  # A docker-registry Secret in the release namespace, for a private registry. The platform
  # repo creates it (scripts/projects/…/setup.sh); empty = pull without logging in.
  pullSecret: ""

server:
  replicas: 1
  port: 6230
  # A Secret with ConnectionStrings__Default (an Npgsql connection string) in the release namespace, created by the platform repo. Without
  # a database the server deliberately does not start.
  databaseSecret: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# The model Suwageval itself calls to give the verdicts of `judge` checks: an OpenAI-compatible
# server (its endpoints directly under baseUrl, e.g. {baseUrl}/chat/completions). Not secrets: a
# URL and a name; the platform repo sets them. Empty baseUrl = no model: the server starts, and a run
# with judge checks is refused. maxConcurrency is the one pool of calls to this model, shared by
# everything that asks (TODO.md, "Parallel runs").
judgeModel:
  baseUrl: ""
  name: ""
  maxConcurrency: 8

# The daily check of that model from the cluster's own network (templates/live-check.yaml): the
# server's image, another command, one judge call with a fixed tiny case. Rendered only with a
# judgeModel. A failure turns the Job red and, with discordSecret, posts to the alerts channel.
liveCheck:
  schedule: "17 6 * * *" # once a day (the CronJob's time zone is Europe/Warsaw)
  # A Secret in the release namespace with LiveCheck__DiscordWebhookUrl (a Discord webhook), created
  # by the platform repo's setup.sh. Optional: empty or missing = the check only fails the Job.
  discordSecret: ""
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 256Mi }

web:
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Checked after every deploy (templates/smoke-test.yaml): a Job Argo runs after each sync.
smokeTest:
  enabled: true
  image: docker.io/curlimages/curl:8.22.0

ingress:
  enabled: true
  className: traefik
  host: suwageval.k8s.example.internal
