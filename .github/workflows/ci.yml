name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate:
    permissions:
      contents: read
    uses: Manomenu/suwgate/.github/workflows/gate.yml@36f0b304991e9c4bc6ecf0a5352e396a350cbac9
    with:
      working-directory: Suwageval.Web
      dotnet: true
      database: true
      oasdiff: true
      browser-install-command: pnpm exec playwright install --with-deps chromium
      command: Suwageval.Web/node_modules/.bin/suwgate check --verbose

  build:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: Suwageval.Server/Dockerfile
          - component: web
            dockerfile: Suwageval.Web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}/${{ matrix.component }}
          tags: type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          platforms: linux/amd64
          provenance: false
