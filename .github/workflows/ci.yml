name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate:
    permissions:
      contents: read
    uses: Manomenu/suwgate/.github/workflows/gate.yml@7c8432804c9be044a08fe2228b9532b7f82dcb38
    with:
      working-directory: Suwageval.Web
      dotnet: true
      oasdiff: true
      command: docker compose --profile db up -d --wait db && Suwageval.Web/node_modules/.bin/suwgate check --verbose

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.11
        env:
          POSTGRES_USER: suwageval
          POSTGRES_PASSWORD: suwageval
          POSTGRES_DB: suwageval
        ports:
          - 5463:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U suwageval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Suwageval.Web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Suwageval.Web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: Suwageval.Web

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: Suwageval.Web

      - run: ./scripts/.internal/e2e.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: .artifacts/e2e/
          retention-days: 14

  build:
    needs: [gate, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: Suwageval.Server/Dockerfile
          - component: web
            dockerfile: Suwageval.Web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}/${{ matrix.component }}
          tags: type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          platforms: linux/amd64
          provenance: false
