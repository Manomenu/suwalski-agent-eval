name: agent-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, like 0.1.0 or 0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  VERSION: ${{ inputs.version }}

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Refuse anything but master
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::a release comes from master, this run is on $GITHUB_REF: merge the change, then run just agent-publish <version> on master."
            exit 1
          fi

      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Refuse a commit whose tree CI has not passed (the ci/tree stamp of its ci run), instead of testing it again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          stamps="$(gh api "repos/$REPOSITORY/commits/$SHA/statuses?per_page=100" --jq '.[] | select(.context == "ci/tree" and .state == "success") | .description')" || stamps=""
          if ! grep -qxF "$tree" <<< "$stamps"; then
            echo "::error::the ci run of $SHA has not passed (no green ci/tree stamp of its tree $tree): wait until it is green, then run just agent-publish $VERSION again."
            exit 1
          fi

      - name: Check the version
        run: ./scripts/.internal/agent-sdk-version.sh "$VERSION"

      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Pack
        run: dotnet pack Suwageval.AgentSdk -c Release -o nupkg -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nupkg
          path: nupkg/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nupkg
          path: nupkg

      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: NuGet/login v1.2.0
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/Suwageval.AgentSdk.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
